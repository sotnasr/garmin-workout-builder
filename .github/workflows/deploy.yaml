name: Deploy to Google Cloud Run

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v0.2.0
        with:
          service_account_key: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          export_default_credentials: true

      - name: Enable required APIs
        run: |
          gcloud services enable run.googleapis.com containerregistry.googleapis.com

      - name: Build and push container
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          gcloud builds submit --tag gcr.io/${{ env.PROJECT_ID }}/garmin-workout-builder --timeout=1800s --verbosity=debug

      - name: Verify image exists
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          gcloud container images list-tags gcr.io/${{ env.PROJECT_ID }}/garmin-workout-builder --format='get(tags)'

      - name: Deploy to Cloud Run
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GARMIN_CLIENT_ID: ${{ secrets.GARMIN_CLIENT_ID }}
          GARMIN_CLIENT_SECRET: ${{ secrets.GARMIN_CLIENT_SECRET }}
        run: |
          gcloud run deploy garmin-workout-builder \
            --image gcr.io/${{ secrets.GCP_PROJECT_ID }}/garmin-workout-builder \
            --platform managed \
            --region us-central1 \
            --allow-unauthenticated \
            --set-env-vars="GARMIN_CLIENT_ID=${{ secrets.GARMIN_CLIENT_ID }},GARMIN_CLIENT_SECRET=${{ secrets.GARMIN_CLIENT_SECRET }}"